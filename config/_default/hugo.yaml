# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: 'Armando W. Gutiérrez'
# Website URL
baseURL: 'https://awgutierrez.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

#cascade:
#  - target:
#      path: /slides/**
#      kind: page
#    outputs: [html, rss]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
#permalinks:
#  authors: '/author/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: Lanczos
  quality: 90
  anchor: Smart
  hint: picture
timeout: 60s
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
        enable: true
  _merge: deep
  highlight:
    lineNos: false
params:
  math: true
security:
  _merge: deep
  allowContent:
  - '! ^text/html$'
  enableInlineShortcodes: false
  exec:
    allow:
    - ^(dart-)?sass(-embedded)?$
    - ^go$
    - ^git$
    - ^node$
    - ^postcss$
    - ^tailwindcss$
    osEnv:
    - '(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$'
  funcs:
    getenv:
    - ^HUGO_
    - ^CI$
#  http:
#    mediaTypes: 
#    methods:
#    - (?i)GET|POST
#    urls:
#    - (?i)^https?://[a-z0-9]
#    - '! ^https?://\d+\.'
#    - '! (?i)localhost'
#    - '! (?i)^https?://[^/?#]*@'
  node:
    permissions:
      allowAddons:
      - tailwindcss
      allowChildProcess:
      - tailwindcss
      allowRead:
      - .
      allowWorker:
      - tailwindcss
      allowWrite: []
      disable: false
sitemap:
  _merge: deep
