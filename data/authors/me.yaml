bio: 
  I'm a Researcher in Mathematics. I've carried out research at [Aalto University](https://www.aalto.fi/en),
  [Inria National Institute for Research in Digital Science and Technology](https://www.inria.fr/en) and [VTT Technical Research Centre of Finland](https://www.vttresearch.com/en). 
  I've made contributions to metric geometry, functional analysis and optimization. 
  I'm passionate about quantum computing, risk analysis and optimization algorithms.

